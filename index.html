<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css">
  <script type="module" src="serie.js"></script>
  <title>Seriescope</title>
</head>

<body class="m-0 bg-black text-white">
  <header class="p-3">
    <div class="d-flex align-items-center gap-3">
      <i class="fa-solid fa-clapperboard"></i>
      <h2 class="m-0">Seriescope</h2>
    </div>
  </header>

  <main class="p-3">
    <h1>Explore les séries TV</h1>
    <p style="color: rgba(186, 186, 186, 1)">
      Retrouve tes séries préférées et enrichis le catalogue.
    </p>
    <section class="form p-3 rounded-2 bg-dark">
      <h3>Ajouter une série</h3>
      <p style="color: rgba(186, 186, 186, 1)">
        Les champs marqués d’un * sont obligatoires.
      </p>

      <form action="ajouter" class="form p-4" id="form_ajouter">
        <div class="mb-3">
          <label for="nom_serie" class="form-label">Nom de la série *</label>
          <input type="text" class="form-control bg-dark text-white" name="nom_serie" placeholder="Ex. The Bear"
            id="nom_serie" required />
            <p  class="text-danger" id="erreurName"></p>
        </div>

        <div class="mb-3">
          <label for="Genre_ajouter" class="form-label">Genre(s) *</label>
          <input type="text" class="form-control bg-dark text-white" name="Genre_ajouter" placeholder="Ex. Drame, Comédie"
            id="Genre_ajouter" required />
            <p  class="text-danger" id="erreurGenre"></p>
            
        </div>

        <div class="mb-3">
          <label for="Description" class="form-label">Description</label>
          <textarea class="form-control text-white bg-dark" name="Description"
            placeholder="Résume la série en quelques mots…" id="Description" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-light btn-lg w-100" id="btn_ajouter">
          +Ajouter
        </button>
        <p id="confirmation"> </p>
      </form>
    </section>
    <h3>Catalogue des séries</h3>
    <p class="text-secondary">Recherche par nom ou explore un genre.</p>

    <section>
      <form action="filtre" class="bg-dark p-4 rounded-3 row g-3 align-items-end">

        <div class="col-12 col-md-5">
          <label for="recherche" class="form-label">Recherche</label>
          <input type="text" id="recherche" name="recherche" class="form-control bg-dark text-white"
            placeholder="Rechercher une série..." />
        </div>


        <div class="col-12 col-md-4">
          <label for="genre" class="form-label">Genre</label>
          <select id="genre" name="genre" class="form-select bg-dark text-white">
            <option value="">Tous les genres</option>
          </select>
        </div>


        <div class="col-12 col-md-3">
          <button type="reset" class="btn btn-light w-100">
            <i class="fa-solid fa-rotate-left"></i>
            Réinitialiser
          </button>
        </div>
      </form>
    </section>
    <h6 class="text-secondary">6 séries affichées</h6>
  </main>
  <section>
    <article id="list_des_serie" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">

    </article>

  </section>
</body>

</html>
